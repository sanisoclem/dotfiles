config_version = 14

[bar.default]
center = [ "control-center", "thepunkoff/pomodoro:widget", "widget", "workspaces" ]
contact_shadow = true
end = [ "audio_visualizer", "tray", "notifications", "keybinds", "clipboard", "volume", "brightness", "battery" ]
margin_ends = 0
position = "left"
start = [ "session", "wallpaper", "mel/wallpaper-refresh:widget", "clock", "date" ]
thickness = 48

[control_center]
sidebar = "full"

[desktop_widgets]
