    box_width = 0.0
    cx = 1897.0
    cy = 322.0
    output = "HDMI-A-2"
    placement_height = 1296.0
    placement_width = 3072.0
    rotation = 0.0
    type = "clock"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
