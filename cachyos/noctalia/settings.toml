    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000006.settings]
        background = false
        clock_style = "digital"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1536.0
    cy = 1077.60009765625
    output = "HDMI-A-2"
    placement_height = 1296.0
    placement_width = 3072.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugins]
auto_update = "all"
enabled = [
    "mel/wallpaper-refresh",
    "thepunkoff/pomodoro",
    "noctalia/wallpaper_depth",
    "samuelskovbakke/calculator-plus",
    "kenn/keybind-cheatsheet"
]

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = true
    kind = "path"
    location = "/home/mel/code/dotfiles/cachyos/noctalia-plugins"
    name = "local"

[shell.screen_corners]
enabled = true

[theme]
builtin = "Tokyo-Night"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "niri", "starship" ]

[wallpaper.automation]
enabled = true

[widget.audio_visualizer]
bands = 20
width = 205

[widget.clock]
font_family = "Symbols Nerd Font Mono"
format = "{:%a %d %b %H:%M}"
vertical_format = "{:%H\\n%M\\n%S}"

[widget.date]
vertical_format = "{:%a\\n%d\\n%m}"

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.network]
show_label = false

[widget.widget]
type = "samuelskovbakke/calculator-plus:widget"
