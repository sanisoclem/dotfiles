# Only things that never change belong here — this file is root-owned once
# installed, so rewriting it would need sudo on every wallpaper change.
#
# The background path is fixed and the image behind it is swapped by
# scripts/sddm-noctalia-sync. Colours come from colors.json in the same
# directory, which the same script writes. Both live in /var/lib/sddm-noctalia,
# which you own, so neither needs privileges to update.
[General]
background=/var/lib/sddm-noctalia/wallpaper.jpg
font=Cantarell
